name: Build Cordova Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create and Build Cordova Project
      run: |
        npm install -g cordova
        
        # Fresh Cordova Project Create Karein
        cordova create app com.alipardahouse.app AliPardaHouse
        
        # HTML, CSS, JS, Drive files aur config.xml ko cordova www folder mein copy karein
        cp -r *.html *.js *.css assets images app/www/ 2>/dev/null || true
        
        if [ -f "config.xml" ]; then
          cp config.xml app/config.xml
        fi
        
        # Project Directory ke andar ja kar Platform Add aur Build karein
        cd app
        cordova platform add android
        cordova build android --verbose

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AliPardaHouse-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
