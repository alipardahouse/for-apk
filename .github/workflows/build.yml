name: Build Cordova Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Prepare & Build Cordova Project
      run: |
        npm install -g cordova
        
        # Check karein ke config.xml kahan hai
        if [ ! -f "config.xml" ]; then
          echo "Config.xml root mein nahi hai, auto-setup create kar rahe hain..."
          cordova create cordovaApp com.alipardahouse.app AliPardaHouse
          
          # HTML/JS/CSS files ko cordovaApp/www mein copy karein
          cp -r *.html *.js *.css assets images www cordovaApp/www/ 2>/dev/null || true
          cp config.xml cordovaApp/ 2>/dev/null || true
          
          cd cordovaApp
        fi
        
        # Cordova Android Platform Add aur Build karein
        cordova platform add android --skip-link || true
        cordova build android --verbose

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AliPardaHouse-APK
        path: "**/platforms/android/app/build/outputs/apk/debug/app-debug.apk"
