name: Build Cordova Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Cordova APK
      run: |
        npm install -g cordova
        # Agar Cordova project initialize na ho to auto-create karein
        if [ ! -f "config.xml" ]; then
          cordova create myApp com.alipardahouse.app AliPardaHouse
          cp -r www/* myApp/www/ 2>/dev/null || true
          cd myApp
        fi
        cordova platform add android --skip-link || true
        cordova build android --verbose

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AliPardaHouse-APK
        path: "**/platforms/android/app/build/outputs/apk/debug/app-debug.apk"
