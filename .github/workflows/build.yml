name: Build Cordova APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Direct GitHub Actions tab se manual run karne ke liye

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Install Project Dependencies
        run: npm ci || npm install

      # Android platform add karein agar pehle se repository mein commit nahi hai
      - name: Add Android Platform
        run: cordova platform add android --nosave || true

      - name: Build Debug APK
        run: cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cordova-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
